# Параметры контейнера АТС — читает установщик (deploy.sh) при генерации
# quadlet-файла /etc/containers/systemd/mikopbx.container (issue #16).
# STOP_TIMEOUT: лимит времени на остановку контейнера, сек (SIGTERM -> SIGKILL).
#   MikoPBX корректно завершает звонки/записи дольше 10 с дефолта Podman.
# PIDS_LIMIT: лимит процессов контейнера. 8192 — запас под звонки/фоновые
#   задачи MikoPBX; раньше было жёстко 4096.
STOP_TIMEOUT=120
PIDS_LIMIT=8192
