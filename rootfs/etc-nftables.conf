#!/usr/sbin/nft -f
# VLANit PBX OS — сетевая политика по умолчанию (ADR-0003).
# input: default drop, разрешено только необходимое для телефонии и управления.
# Ограничить управление подсетями админа: заменить accept на
# «ip saddr { 10.x.0.0/16 } accept» для tcp/22 и udp/51820.
flush ruleset

table inet filter {
  chain input {
    type filter hook input priority filter; policy drop;

    ct state established,related accept
    iifname "lo" accept

    ip protocol icmp accept
    ip6 nexthdr icmpv6 accept

    # управление
    tcp dport 22 accept          # SSH устройства
    udp dport 51820 accept       # WireGuard

    # телефония (MikoPBX, host network)
    tcp dport { 80, 443 } accept          # веб-интерфейс
    tcp dport { 5060, 5061 } accept       # SIP/TLS
    udp dport { 5060, 10000-10800 } accept # SIP/RTP
  }

  chain forward {
    type filter hook forward priority filter; policy drop;
    # форвардинг — только для WireGuard (road-warrior доступ к АТС)
    ct state established,related accept
    iifname "wg0" accept
    oifname "wg0" accept
  }
}
