# Сборка ISO VLANit PBX OS.
# Правило релизов (идея #11, docs/ideas/engine-package.md):
#   - тег и файлы релиза не меняются после публикации;
#   - каждый релиз собирает CI из запушенных исходников (на коммите тега);
#   - контрольные суммы подписаны GPG-ключом релиза (pub в rootfs/etc-vlanit-release.pub).
#
# Триггеры:
#   - push тега v*          -> сборка + публикация релиза с этим тегом;
#   - workflow_dispatch     -> сборка (+ публикация при release: true).
name: build-iso

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release:
        description: "Опубликовать релиз v<version> после сборки"
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    # GITHUB_TOKEN в этом репозитории по умолчанию только на чтение;
    # запись нужна шагу публикации релиза.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Payload MikoPBX (pull + verify digest)
        run: bash scripts/pull-mikopbx.sh

      - name: Сборка ISO
        run: make iso

      - name: Подпись контрольных сумм (GPG)
        env:
          RELEASE_GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
        # dist/* созданы build-контейнером от root — отдать раннеру для подписи
        run: |
          sudo chown -R "$USER":"$USER" dist
          bash scripts/sign-release.sh

      - name: Артефакт ISO
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.release }}
        uses: actions/upload-artifact@v4
        with:
          name: vlanit-pbx-iso
          path: |
            dist/*.iso
            dist/*.iso.sha256
            dist/*.iso.sha256.asc
          retention-days: 14

      - name: Публикация релиза
        # тег: всегда; ручной запуск: по параметру
        if: ${{ github.event_name == 'push' || inputs.release }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Описание релиза — секция "## X.Y.Z" из CHANGELOG.md на коммите тега
        # (часть исходников; тег не меняется после публикации). Если секция
        # не найдена — автогенерация из коммитов.
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            VER=$(grep -oP 'version:\s*"\K[0-9.]+' config/build.yaml | head -1)
            TAG="v${VER}"
          fi
          VER="${TAG#v}"
          NOTES="$(awk -v ver="$VER" '
            $0 ~ "^## " ver " " {capture=1; next}
            /^## / {capture=0}
            capture {print}
          ' CHANGELOG.md)"
          if [ -n "$NOTES" ]; then
            printf 'VLANit PBX OS %s\n\n%s\n' "$VER" "$NOTES" > /tmp/release-notes.md
            NOTES_ARG=(--notes-file /tmp/release-notes.md)
          else
            echo "WARN: секция ## $VER не найдена в CHANGELOG.md — автогенерация"
            NOTES_ARG=(--generate-notes)
          fi
          gh release create "$TAG" dist/*.iso dist/*.iso.sha256 dist/*.iso.sha256.asc \
            --title "VLANit PBX OS ${VER}" \
            --verify-tag \
            "${NOTES_ARG[@]}"
